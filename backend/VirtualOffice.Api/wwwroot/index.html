<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c5cff'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='white'>◆</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <!-- UI de kanban/horas/objetivos compartilhada com o cliente do jogo -->
  <link rel="stylesheet" href="shared/work-ui.css">
</head>
<body>
  <div id="login"></div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">◆</div>
        <div><b>Office Quest</b><span>escritório virtual</span></div>
      </div>
      <nav id="nav">
        <a class="nav-item" data-route="board"><span class="ic">▦</span> Kanban</a>
        <a class="nav-item" data-route="backlog"><span class="ic">☰</span> Backlog</a>
        <a class="nav-item" data-route="hours"><span class="ic">⏱</span> Horas</a>
        <a class="nav-item" data-route="goals"><span class="ic">🎯</span> Objetivos</a>
        <a class="nav-item" data-route="reports"><span class="ic">📊</span> Relatórios</a>
        <div class="nav-sep"></div>
        <a class="nav-item" data-route="meeting"><span class="ic">🎧</span> Reunião</a>
        <a class="nav-item" data-route="chat"><span class="ic">💬</span> Chat do jogo</a>
        <a class="nav-item" data-route="profile"><span class="ic">🏅</span> Perfil</a>
      </nav>
      <div class="me" id="me-card"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Kanban</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="spacer"></div>
        <div id="topbar-actions"></div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="lib/signalr.min.js"></script>
  <script src="lib/livekit-client.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
