# Build de produção do Office Quest.
# Sobe: Postgres, backend (.NET), game (Phaser/nginx), LiveKit e Caddy (proxy + TLS).
# Caddy unifica o game + API na mesma origem (https://localhost), o app web em :8443
# e o LiveKit (wss) em :7443, todos com certificado self-signed (sem domínio).
# Antes: copie .env.example para .env e ajuste os segredos. Ver docs/DEPLOY_DOCKER.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend/VirtualOffice.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Banco limpo: só o catálogo curado (tipos de lançamento, objetivos, itens).
      # Ligue apenas se quiser o time fictício para demonstrar o produto.
      Seed__DemoData: "${SEED_DEMO_DATA:-false}"
      # --- economia (o beta abre com 10 mil moedas por usuário) ---
      Game__WelcomeGrantCoins: "${GAME_WELCOME_GRANT_COINS:-0}"
      Game__WelcomeGrantKey: "${GAME_WELCOME_GRANT_KEY:-beta-v1}"
      # Caixa do Beta Tester (o catálogo inteiro) para todo mundo. DESLIGADA aqui:
      # é ferramenta de teste, e ligada não sobra economia nenhuma para sentir.
      # Ligue só num ambiente de teste; o endpoint /api/admin/beta-box continua
      # dando a caixa sob demanda. Ver docs/PLANO_EQUIPAMENTOS.md §6.3.
      Game__BetaBoxForEveryone: "${GAME_BETA_BOX:-false}"
      Game__BetaBoxKey: "${GAME_BETA_BOX_KEY:-beta-box-v1}"
      Game__TimeZoneOffsetHours: "${GAME_TZ_OFFSET:--3}"
      # --- auth ---
      Auth__DevBypass: "${AUTH_DEV_BYPASS}"
      Auth__PasswordEnabled: "${AUTH_PASSWORD_ENABLED:-true}"
      Auth__AllowRegistration: "${AUTH_ALLOW_REGISTRATION:-true}"
      Auth__JwtKey: "${JWT_KEY}"
      # A PRIMEIRA origem é também o destino padrão do login (AuthEndpoints.IsAllowedReturn),
      # então PUBLIC_ORIGIN tem que ser a do produto. Em produção as duas viram o domínio
      # real (o app web fica em /app/ da mesma origem). Ver docs/DEPLOY_SERVIDOR.md.
      Auth__AllowedOrigins__0: "${PUBLIC_ORIGIN:-https://localhost}"
      Auth__AllowedOrigins__1: "${PUBLIC_APP_ORIGIN:-https://localhost:8443}"
      Auth__HostedDomain: "${GOOGLE_HOSTED_DOMAIN}"
      Auth__GoogleClientId: "${GOOGLE_CLIENT_ID}"
      Auth__GoogleClientSecret: "${GOOGLE_CLIENT_SECRET}"
      Auth__GoogleRedirectUri: "${PUBLIC_ORIGIN:-https://localhost}/auth/google/callback"
      # --- livekit ---
      # A URL é a que o NAVEGADOR usa. Com LiveKit Cloud (LIVEKIT_URL preenchido) a
      # mídia vai direto para a nuvem e a voz atravessa redes — é o que o túnel exige,
      # porque UDP não passa por túnel HTTP. Sem LIVEKIT_URL cai no container local,
      # que só serve para quem está na mesma máquina/LAN.
      LiveKit__Url: "${LIVEKIT_URL:-wss://localhost:7443}"
      LiveKit__ApiKey: "${LIVEKIT_API_KEY}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  game:
    build: ./client-web
    restart: unless-stopped

  # SFU local — OPCIONAL. Só sobe com o perfil `local-livekit`:
  #     docker compose --profile local-livekit up -d
  # Serve para rodar sem depender da nuvem, mas a voz fica restrita à LAN.
  # Para acesso externo (túnel) use a LiveKit Cloud via LIVEKIT_URL no .env.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["local-livekit"]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.docker.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"        # RTC/TCP (fallback para rede que bloqueia UDP)
      - "7882:7882/udp"    # mídia WebRTC (UDP mux — uma porta só, ver livekit.docker.yaml)
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [backend, game]
    ports:
      - "443:443"     # game + API (mesma origem), HTTPS self-signed
      - "8443:8443"   # app web (kanban/horas)
      - "7443:7443"   # LiveKit local (só usado com o perfil local-livekit)
      - "8080:8080"   # origem HTTP única para o Cloudflare Tunnel
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
