server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mapas do Tiled carregados em runtime (fetch + JSON.parse).
  location ~ \.(tmj|tsj|tj)$ {
    default_type application/json;
    add_header Cache-Control "no-cache";
  }

  # Fonte (JS/JSON) sem cache agressivo — o jogo é orientado a dados.
  location ~ \.(js|json)$ {
    add_header Cache-Control "no-cache";
  }

  # Assets (imagens/áudio) podem cachear.
  location ~* \.(png|jpg|jpeg|gif|webp|svg|mp3|ogg|wav)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
