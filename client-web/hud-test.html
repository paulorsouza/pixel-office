<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness da HUD (sem Phaser)</title>
<!-- O CSS é o DE VERDADE: um harness com estilo próprio testaria outra coisa. -->
<link rel="stylesheet" href="src/hud/hud.css">
<style>
  /* Só o que substitui o Phaser: o canvas do jogo vira um retângulo. */
  #game{display:grid;place-items:center;
    background:radial-gradient(circle at 30% 30%,#3a4a3a,#232a33 60%);color:#9fb59f;
    font:600 18px Inter,system-ui,sans-serif}
</style>
</head>
<body>
<div id="game">(área do jogo — placeholder)</div>
<div id="scene-card" class="hud"><strong id="scene-name">Escritório Tooq</strong><span id="scene-subtitle">harness</span></div>
<div id="portal-prompt" class="hud on"><kbd>E</kbd><span>entrar</span></div>
<script type="module">
import { createMeetingHUD } from './src/MeetingHUD.js';
import { createHudShell } from './src/hud/HudShell.js';
import { createDock } from './src/hud/Dock.js';
import { createHelpSheet } from './src/hud/HelpSheet.js';

// ---- chassi da HUD: dock, folhas e o registro de quem bloqueia o mundo ----
const shell = createHudShell();
const help = createHelpSheet(shell);
// Painel falso para exercitar o registro: `shell.isBlocking()` tem de virar true.
const fakePanel = { open: false };
shell.register({ id: 'fake-panel', isOpen: () => fakePanel.open });
const opened = [];
const item = (id, icon, label, hint, extra = {}) => ({
  id, icon, label, hint, onSelect: () => opened.push(id), ...extra,
});
let decorateRoom = null;
const dock = createDock(shell, [
  item('work', '⌂', 'Trabalho', 'Quadro, backlog, horas e objetivos'),
  item('character', '🙂', 'Personagem', 'Aparência do avatar'),
  item('items', '🎒', 'Itens', 'Equipamentos e veículos'),
  item('store', '🛒', 'Loja', 'Móveis e meios de locomoção'),
  item('cards', '🃏', 'Cartas', 'Álbum, boosters e baralho'),
  item('decorate', '✦', 'Decorar', 'Mover os móveis desta sala', { visible: () => Boolean(decorateRoom) }),
  { id: 'help', icon: '?', label: 'Como jogar', hint: 'Teclas e gestos', onSelect: () => help.toggle() },
]);
window.hudShell = shell;
window.hudDock = dock;
window.hudHelp = help;
window.hudOpened = opened;
window.hudFakePanel = fakePanel;
window.setDecorateRoom = (value) => { decorateRoom = value; dock.refresh(); };

const state = { mic: false, cam: false, scr: false };
const hud = createMeetingHUD({
  onToggleMic: () => { state.mic = !state.mic; sync(); },
  onToggleCamera: () => { state.cam = !state.cam; toggleFakeCam(); sync(); },
  onToggleScreen: () => { state.scr = !state.scr; toggleFakeScreen(); sync(); },
  onJoin: () => { sync('connected'); },
  onLeave: () => { setChannel('open'); sync('off'); },
  onReleaseHeadset: () => { setChannel('room'); },
  onToggleLock: () => { room.locked = room.locked ? null : { name: 'Paulo Souza', key: 'me', mine: true }; setChannel(kind); },
  onToggleReserve: () => { room.reserved = room.reserved ? null : { name: 'Paulo Souza', key: 'me', mine: true }; setChannel(kind); },
  listDevices: async (kind) => ({
    audioinput: [{ deviceId: 'a', label: 'Microfone interno' }, { deviceId: 'b', label: 'Headset USB' }],
    audiooutput: [{ deviceId: 'c', label: 'Alto-falantes' }],
    videoinput: [{ deviceId: 'd', label: 'Webcam integrada' }],
  }[kind] || []),
  activeDevice: (kind) => ({ audioinput: 'a', audiooutput: 'c', videoinput: 'd' }[kind] || ''),
  switchDevice: async () => {},
});
hud.initialize();

let status = 'connected';
function sync(next) {
  if (next) status = next;
  hud.setSession({ status, micOn: state.mic, camOn: state.cam, screenOn: state.scr,
    startedAt: Date.now() - 125000, sceneName: 'Escritório Tooq' });
  hud.syncParticipants(status === 'connected' ? [
    { identity: '1-abc', name: 'Paulo Souza', isLocal: true, micOn: state.mic },
    { identity: '2-def', name: 'Ana Lima', isLocal: false, micOn: true },
    { identity: '3-ghi', name: 'Bruno Castro', isLocal: false, micOn: false },
  ] : [], [{ userId: 9, name: 'Carla Dias' }]);
  if (status === 'connected') {
    hud.setSpeaking(new Set(['2-def']));
    hud.setProximity('2-def', 0.92);
    hud.setProximity('3-ghi', 0.3);
  }
}
// canal: 'open' (proximidade), 'room' (sala fechada), 'pinned' (fone vestido)
const room = { locked: null, reserved: null };
let kind = 'open';
function setChannel(next) {
  kind = next;
  if (kind === 'open') {
    hud.setChannel({ kind: 'open', name: 'Área aberta', pinned: false, locked: null, reserved: null });
  } else {
    hud.setChannel({
      kind: 'room', name: 'Escritório B', pinned: kind === 'pinned',
      locked: room.locked, reserved: room.reserved,
    });
  }
}
setChannel('open');
window.setChannel = setChannel;
window.room = room;

sync();

function fakeVideo(label, hue) {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 360;
  const ctx = c.getContext('2d');
  let t = 0;
  setInterval(() => {
    t += 0.05;
    ctx.fillStyle = `hsl(${hue} 40% 22%)`;
    ctx.fillRect(0, 0, 640, 360);
    ctx.fillStyle = `hsl(${hue} 70% 60%)`;
    ctx.beginPath();
    ctx.arc(320 + Math.sin(t) * 80, 180 + Math.cos(t * 0.7) * 40, 46, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '28px Inter,system-ui';
    ctx.fillText(label, 24, 328);
  }, 66);
  const v = document.createElement('video');
  v.srcObject = c.captureStream(15);
  v.autoplay = true; v.muted = true; v.playsInline = true;
  return v;
}

// vídeo remoto fixo de exemplo
const anaCam = fakeVideo('Câmera da Ana', 200);
hud.addTrack('2-def', 'camera', anaCam);

let myCam = null;
function toggleFakeCam() {
  if (state.cam) { myCam = fakeVideo('Sua câmera', 260); hud.addTrack('1-abc', 'camera', myCam); }
  else if (myCam) { hud.removeTrack('1-abc', 'camera', myCam); myCam = null; }
}
let myScreen = null;
function toggleFakeScreen() {
  if (state.scr) { myScreen = fakeVideo('Sua tela compartilhada', 40); hud.addTrack('1-abc', 'screen', myScreen); }
  else if (myScreen) { hud.removeTrack('1-abc', 'screen', myScreen); myScreen = null; }
}

window.hud = hud;
window.hudSync = sync;
window.hudState = state;
</script>
</body>
</html>
